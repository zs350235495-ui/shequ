<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="机场社区安全外链承接中心，正准备安全跳转至目标服务商官方站点。">
  <title>正在安全前往服务商官网 - 机场社区</title>
  <style>
    :root {
      --primary-color: #b93826;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .redirect-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 24px;
      border: 4px solid #334155;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .badge-sec {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(185, 56, 38, 0.15);
      color: #f87171;
      border: 1px solid rgba(185, 56, 38, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .manual-link {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 24px;
      background: var(--primary-color);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .manual-link:hover {
      background: #991b1b;
    }
    .home-link {
      display: block;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner" id="loading-spinner"></div>
    <div class="badge-sec">🛡️ SSL 安全重定向通道</div>
    <h1 id="redirect-title">正在安全前往服务商官网...</h1>
    <p id="redirect-desc">机场社区已为您启用安全外链隔离验证，浏览器正在自动跳转至目标官方网站，请稍候。</p>
    <a id="direct-btn" href="/reviews.html" class="manual-link" rel="nofollow sponsored noopener noreferrer">直接前往目标站点 ↗</a>
    <a href="/index.html" class="home-link">返回机场社区首页</a>
  </div>

  <script>
    (function() {
      var AFF_MAP = {
        'huanqiuti': { name: '环球梯', url: 'https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0' },
        'dalaoyun': { name: '大佬云', url: 'https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa' },
        'yunjiexian': { name: '云界线', url: 'https://pp01.yunjiexianaff.com/#/?code=bp0ZSKBV' },
        'shandianshu': { name: '闪电鼠', url: 'https://ppsvip01.shandianshuaff.com/#/?code=QbLF8tjB' },
        'liulianyun': { name: '榴莲云', url: 'https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G' },
        'shenxing': { name: '神行加速', url: 'https://pps123.shenxingaff.com/#/?code=6tQ7zHUc' },
        'kexinyun': { name: '可信云', url: 'https://everett7623.kosingaff.com/#/?code=sFKkfEYs' },
        'shunyun': { name: '顺云', url: 'https://ddd.jichang.best/#/register?code=nldUZaYc' },
        'yuntu': { name: '云图', url: 'https://super.ytjcok.org/#/register?code=poKwFVtv' },
        'jilianyun': { name: '极连云', url: 'https://haozevpn.jlyvipaff.com/#/?code=jwCMOvQO' },
        'kuaili': { name: '快狸', url: 'https://fanxiaobin.kuailiaff.com/#/?code=e0cAmK7F' },
        'guangnianti': { name: '光年梯', url: 'https://gnt001.gntvipaff.cc/#/?code=PQhPFDhO' },
        'kunpeng': { name: '鲲鹏加速', url: 'https://kunpengjiasu.com/#/register?code=WPugVZUe' },
        'bianyuan': { name: '边缘云', url: 'https://wep.edgenovaaff.com/#/?code=mLLL6h6F' },
        'sujie': { name: '速捷', url: 'https://pygllc.speedworldaff.cc/#/?code=kcoensXG' }
      };

      var params = new URLSearchParams(window.location.search);
      var targetId = params.get('id') || params.get('target') || '';
      targetId = targetId.toLowerCase().trim();

      var directBtn = document.getElementById('direct-btn');
      var titleEl = document.getElementById('redirect-title');
      var descEl = document.getElementById('redirect-desc');

      if (targetId && AFF_MAP[targetId]) {
        var item = AFF_MAP[targetId];
        document.title = '正在前往 ' + item.name + ' 官网... - 机场社区';
        titleEl.textContent = '正在前往 ' + item.name + ' 官网...';
        descEl.textContent = '您正在通过机场社区专享渠道前往【' + item.name + '】官方网站。若页面未在 2 秒内自动跳转，请点击下方按钮：';
        directBtn.href = item.url;
        directBtn.textContent = '立即前往 ' + item.name + ' ↗';
        
        // 执行快速安全替换跳转
        window.location.replace(item.url);
      } else {
        document.getElementById('loading-spinner').style.display = 'none';
        titleEl.textContent = '未识别到目标服务商';
        descEl.textContent = '您所请求的服务商参数无效或已下线。您可以前往全站评测页面查看当前精选的专线机场列表。';
        directBtn.href = '/reviews.html';
        directBtn.textContent = '浏览 2026 最新机场评测榜单 →';
      }
    })();
  </script>
  <noscript>
    <div style="margin-top: 15px; font-size: 12px; color: #cbd5e1;">
      提示：您的浏览器未启用 JavaScript，请点击上方按钮继续访问目标服务商官网。
    </div>
  </noscript>
</body>
</html>
